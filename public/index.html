  <!-- IDM Integration Module Detector and Blocker (Deferred to non-critical idle time) -->
  <script>
    (function() {
      function initIDMDetector() {
        // 1. Create a dummy video element that looks like a real course video to IDM
        var detector = document.createElement('video');
        detector.id = 'idm-detector';
        detector.style.position = 'fixed';
        detector.style.top = '-9999px';
        detector.style.left = '-9999px';
        detector.style.width = '1px';
        detector.style.height = '1px';
        detector.style.opacity = '0';
        detector.style.pointerEvents = 'none';
        detector.preload = 'metadata';
        detector.muted = true;
        detector.setAttribute('aria-hidden', 'true');
        detector.setAttribute('tabindex', '-1');
      
      var track = document.createElement('track');
      track.kind = 'captions';
      detector.appendChild(track);
      
      var source = document.createElement('source');
      source.src = 'assets/videos/dummy.mp4';
      source.type = 'video/mp4';
      detector.appendChild(source);
      
      document.body.appendChild(detector);

      // 2. Define the blocking screen trigger function
      function showIDMBlocker() {
        if (document.getElementById('idm-blocker-overlay')) return;
        
        var overlay = document.createElement('div');
        overlay.id = 'idm-blocker-overlay';
        overlay.innerHTML = `
          <div class="idm-card animate-in">
            <div class="idm-icon-wrapper">
              <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2>تنبيه أمني: تم كشف إضافة IDM!</h2>
            <p>عزيزنا العميل، يرجى إيقاف أو تعطيل إضافة <strong>IDM Integration Module (Internet Download Manager)</strong> من متصفحك لتتمكن من استخدام المنصة ومشاهدة الدروس بأمان.</p>
            
            <div class="idm-steps">
              <h3>كيفية تعطيل الإضافة:</h3>
              <ol>
                <li>افتح صفحة الإضافات بمتصفحك (اذهب إلى <code>chrome://extensions</code>).</li>
                <li>ابحث عن إضافة <strong>IDM Integration Module</strong>.</li>
                <li>قم بإيقاف تشغيل الإضافة مؤقتاً عبر زر التفعيل.</li>
                <li>بعد التعطيل، قم بإعادة تحميل هذه الصفحة.</li>
              </ol>
            </div>
            
            <button class="idm-btn" onclick="window.location.reload()">
              <i class="fa-solid fa-rotate-right"></i>
              إعادة تحميل الصفحة
            </button>
          </div>
        `;
        
        var style = document.createElement('style');
        style.innerHTML = `
          #idm-blocker-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999999;
            font-family: 'Cairo', 'Tajawal', sans-serif;
            color: #f1f5f9;
            direction: rtl;
            padding: 20px;
          }
          
          .idm-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
          }
          
          .idm-icon-wrapper {
            width: 80px;
            height: 80px;
            background: rgba(225, 29, 72, 0.15);
            border: 1px solid rgba(225, 29, 72, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
            color: #e11d48;
            font-size: 2.5rem;
          }
          
          .idm-card h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: #f1f5f9;
          }
          
          .idm-card p {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 24px;
          }
          
          .idm-steps {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 20px;
            text-align: right;
            margin-bottom: 24px;
          }
          
          .idm-steps h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 12px;
          }
          
          .idm-steps ol {
            margin-right: 20px;
            color: #94a3b8;
            font-size: 0.875rem;
            line-height: 1.7;
          }
          
          .idm-steps li {
            margin-bottom: 8px;
          }
          
          .idm-steps code {
            background: #1e293b;
            color: #fda4af;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            direction: ltr;
            display: inline-block;
          }
          
          .idm-btn {
            background: #e11d48;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
          }
          
          .idm-btn:hover {
            background: #be123c;
            transform: scale(1.03);
          }
          
          .idm-btn:active {
            transform: scale(0.98);
          }
          
          @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
          }
          
          .animate-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
          }
        `;
        document.head.appendChild(style);
        document.body.appendChild(overlay);
        document.body.style.overflow = 'hidden';
      }

      // 3. Monitor elements for IDM attributes
      function checkElements() {
        var videos = document.getElementsByTagName('video');
        for (var i = 0; i < videos.length; i++) {
          if (videos[i].hasAttribute('__idm_id__') || videos[i].hasAttribute('idm_id')) {
            showIDMBlocker();
            return;
          }
        }
        var audios = document.getElementsByTagName('audio');
        for (var i = 0; i < audios.length; i++) {
          if (audios[i].hasAttribute('__idm_id__') || audios[i].hasAttribute('idm_id')) {
            showIDMBlocker();
            return;
          }
        }
      }

      // 4. Use MutationObserver to detect attributes added dynamically
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.type === 'attributes') {
            if (mutation.attributeName === '__idm_id__' || mutation.attributeName === 'idm_id') {
              showIDMBlocker();
            }
          }
        });
      });
      
      // Wait for detector body append
      setTimeout(function() {
        var det = document.getElementById('idm-detector');
        if (det) {
          observer.observe(det, { attributes: true });
        }
      }, 100);

      // In case IDM injects on other dynamically created video tags
      var bodyObserver = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.addedNodes) {
            mutation.addedNodes.forEach(function(node) {
              if (node.nodeName === 'VIDEO' || node.nodeName === 'AUDIO') {
                observer.observe(node, { attributes: true });
                // Check immediately
                if (node.hasAttribute('__idm_id__') || node.hasAttribute('idm_id')) {
                  showIDMBlocker();
                }
              }
            });
          }
        });
      });
      bodyObserver.observe(document.body, { childList: true, subtree: true });

      // 5. Periodic polling checks (every 1000ms) for safety
      setInterval(checkElements, 1000);
      }

      if ('requestIdleCallback' in window) {
        requestIdleCallback(initIDMDetector);
      } else {
        window.addEventListener('load', initIDMDetector);
      }
    })();
  </script>
